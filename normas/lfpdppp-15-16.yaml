nota_verificacion: >
  Transcrito literal del texto vigente. QUIÉN debe cumplirlo: el RESPONSABLE, que
  es la flota — no Likida. Likida es persona encargada (art. 2 fr. XII) y trata
  los datos por cuenta de la flota.

  Decir "esto expone a Likida por omitir el aviso" es incorrecto e invierte quién
  lo redacta. Likida responde por contrato y por tratar datos fuera de las
  instrucciones de la flota, no por la omisión del aviso.
contexto_verificado: >
  El art. 16 fr. II es el que aplica al flujo de WhatsApp: los datos entran por
  medio electrónico, así que lo exigible en el canal es la modalidad
  SIMPLIFICADA — fracciones I a IV del art. 15 — más la ruta al aviso integral.
  No hay que meter el aviso completo en un mensaje de WhatsApp.
impacto_en_producto: >
  Likida no redacta el aviso de la flota, pero sí tiene que darle el mecanismo
  para ponerlo a disposición en el primer contacto por WhatsApp, y guardar
  constancia de que se puso. Sin el mecanismo, la flota no puede cumplir aunque
  quiera, y ese es un hueco de producto — no de Likida ante la autoridad.
