id: rmf-2026-9.1.8
tipo: regla_general
jerarquia: 3
instrumento: "Resolución Miscelánea Fiscal para 2026"
articulo_o_regla: "9.1.8 (Título 9, Capítulo 9.1)"
titulo: "Requisitos operativos del estímulo del 50% de peaje: aviso de marzo, bitácora de viaje conciliada, pago electrónico y factor 0.5 sin IVA"
citas_en_codigo: ["RMF 9.1.8", "regla 9.1.8"]
texto_vigente: >
  Fracción I: "Presentar durante el mes de marzo del siguiente año, mediante
  buzón tributario, aviso en el que se señale que es sujeto del estímulo
  [...] En el aviso [...] se deberá incluir el inventario de los vehículos que
  se hayan utilizado durante el año inmediato anterior, en la Red Nacional de
  Autopistas de Cuota, desglosado de la siguiente manera: a) Denominación del
  equipo, incluyendo el nombre técnico y comercial, así como la capacidad de
  carga o de pasajeros [...] b) Modelo de la unidad. c) Número de control de
  inventario o, en su defecto, el número de serie y los datos de la placa
  vehicular. d) Fecha de incorporación o de baja del inventario [...]"
  ---
  Fracción II: "Llevar una bitácora de viaje de origen y destino, así como la
  ruta de que se trate, que coincida con el estado de cuenta de la tarjeta de
  identificación automática vehicular o de un sistema electrónico de pago.
  Caminos y Puentes Federales de Ingresos y Servicios Conexos podrá
  proporcionar el servicio de expedición de reportes que contenga la
  información requerida."
  ---
  Fracción III: "Efectuar los pagos de autopistas mediante la tarjeta de
  identificación automática vehicular o de cualquier otro sistema electrónico
  de pago con que cuente la autopista y conservar los estados de cuenta" de
  dicha tarjeta o sistema.
  ---
  Fracción IV: "Para la determinación del monto del acreditamiento, se
  aplicará al importe pagado por concepto del uso de la infraestructura
  carretera de cuota, sin incluir el IVA, el factor de 0.5 para toda la Red
  Nacional de Autopistas de Cuota."
consecuencias_operativas:
  - "La fr. III mata el efectivo: una caseta pagada en ventanilla con billetes NO genera estímulo aunque después se facture."
  - "La fr. II es una conciliación viaje por viaje contra el estado de cuenta del TAG, no un total mensual."
  - "La fr. IV resuelve la base: importe SIN IVA × 0.5 — la lectura conservadora que el motor ya aplicaba (ver H4 de la ficha lif-2026-20-A, RESUELTO)."
  - "La regla instrumenta el estímulo de la LIF 2026 art. 20, apartado A, fr. V; las condiciones de fondo (exclusividad, Red Nacional, <300 MDP, no parte relacionada) viven en la ley, no aquí."
fecha_publicacion: 2025-12-28
fecha_vigencia_desde: 2026-01-01
