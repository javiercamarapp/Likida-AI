id: lfpdppp-2025-art-59
tipo: ley
jerarquia: 1
instrumento: "Ley Federal de Protección de Datos Personales en Posesión de los Particulares"
articulo_o_regla: "59"
titulo: "Sanciones — los rangos reales de multa"
citas_en_codigo: ["LFPDPPP 59"]
texto_vigente: >
  Artículo 59. Las infracciones a la presente Ley serán sancionadas por la
  Secretaría con:
  I. El apercibimiento para que el responsable lleve a cabo los actos solicitados
  por la persona titular, en los términos previstos por esta Ley, tratándose de
  los supuestos previstos en la fracción I del artículo anterior;
  II. Multa de 100 a 160,000 veces la Unidad de Medida y Actualización, en los
  casos previstos en las fracciones II a VII del artículo anterior;
  III. Multa de 200 a 320,000 veces la Unidad de Medida y Actualización, en los
  casos previstos en las fracciones VIII a XVIII del artículo anterior, y
  IV. En caso de que de manera reiterada persistan las infracciones citadas en
  los incisos anteriores, se impondrá una multa adicional que irá de 100 a
  320,000 veces la Unidad de Medida y Actualización. En tratándose de
  infracciones cometidas en el tratamiento de datos sensibles, las sanciones
  podrán incrementarse hasta por dos veces, los montos establecidos.
