nota_verificacion: >
  CORRIGE la cifra que circulaba en el proyecto. Se decía "200,000–320,000 UMA".
  El rango real de la fracción III es de 200 A 320,000 UMA — el piso son
  doscientas UMA, no doscientas mil. El "hasta por dos veces" de la fracción IV
  aplica a datos SENSIBLES, y los datos financieros no son sensibles: exigen
  consentimiento expreso, que es otra cosa.

  Es una cifra que multiplica por mil el piso. No repetirla frente a un cliente.
contexto_verificado: >
  Quien sanciona es la Secretaría Anticorrupción y Buen Gobierno (art. 2 fr. XV),
  no el INAI. El art. 60 manda considerar la naturaleza del dato, la
  intencionalidad, la capacidad económica del responsable y la reincidencia.
impacto_en_producto: >
  Sirve para dimensionar el argumento de venta sin inflarlo. La sanción recae
  sobre el RESPONSABLE —la flota— así que es un riesgo del cliente que Likida
  ayuda a bajar, no un riesgo propio que se le traslade.
