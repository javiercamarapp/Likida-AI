version_anterior: rfa-2022-1.2
nota_renumeracion: >
  Era la regla "1.2" en la RFA 2022. El contenido (8%, tope de $1,000,000, 16%
  definitivo) no cambió con la renumeración.
advertencia: >
  NO cubre combustible. La regla lo excluye expresamente. Prometerle a un contralor
  que el diésel sin factura "entra en el 8%" es falso.
