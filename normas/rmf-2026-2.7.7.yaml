id: rmf-2026-2.7.7
tipo: regla_general
jerarquia: 3
instrumento: "Resolución Miscelánea Fiscal para 2026"
articulo_o_regla: "Sección 2.7.7 (2.7.7.1.1, 2.7.7.1.2, 2.7.7.2.1, 2.7.7.2.8)"
titulo: "Complemento Carta Porte: obligados, traslado local y la excepción del radio de 30 km"
citas_en_codigo: ["2.7.7.1.1", "2.7.7.2.1", "2.7.7.2.8", "Carta Porte"]
texto_vigente: >
  2.7.7.1.1 (primer párrafo, extracto): los contribuyentes, intermediarios o
  agentes de transporte dedicados al servicio de transporte de carga general y
  especializada que circulen por vía terrestre, férrea, aérea o naveguen por vía
  marítima, "deben expedir un CFDI de tipo ingreso con los requisitos
  establecidos en el artículo 29-A del CFF, al que deben incorporar el
  'Complemento Carta Porte'". Último párrafo: tanto quien contrate el servicio
  como quien lo preste serán responsables ante la autoridad cuando esta detecte
  alguna irregularidad en los datos, y "dicha responsabilidad se limitará a los
  datos que proporcione cada una de las partes".
  2.7.7.2.1: el transportista que NO transite por tramos de jurisdicción federal
  puede acreditar el transporte con el CFDI de ingreso SIN complemento; aplica
  solo con "plena certeza" de no pisar federal, y si por cualquier causa se pisa,
  deben emitirse los CFDI conforme a 2.7.7.1.1 y 2.7.7.1.2. Excluidos de la
  facilidad: transportistas extranjeros, hidrocarburos/petrolíferos, despacho
  aduanero y medicamentos.
  2.7.7.2.8: los vehículos que no excedan los pesos y dimensiones de un camión
  tipo C2 (NOM-012-SCT-2-2017) se entiende que NO transitan por tramos federales
  "siempre que en su trayecto la longitud del tramo federal que se pretenda
  utilizar no exceda de un radio de distancia de 30 kilómetros, los cuales se
  computarán entre el origen inicial y el destino final, incluyendo los puntos
  intermedios del traslado". Aplica también a remolques que no excedan el C2.
fecha_publicacion: 2025-12-28
fecha_vigencia_desde: 2024-07-17
fuente_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/documentos2026/rmf/rmf/RMF_2026-DOF-28122025.pdf"
