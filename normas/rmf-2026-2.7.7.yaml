nota_verificacion: >
  Texto extraído del PDF oficial de la RMF 2026 (DOF 28-dic-2025) el
  27-jul-2026; investigación completa con validaciones del Estándar CCP 3.1 y
  el Instructivo Autotransporte en docs/conocimiento/02-carta-porte.md.
  La fecha de vigencia es la de la VERSIÓN 3.1 del complemento (obligatoria
  desde el 17-jul-2024, página oficial del SAT); la obligación de fondo existe
  desde 2021 y NO tiene periodo de gracia en 2026 — se leyeron los 25
  transitorios de la RMF 2026 y la 1a Resolución de Modificaciones
  (DOF 09-jul-2026) no tocó la Sección 2.7.7. Los catálogos
  (catCartaPorte.xsd) cambiaron el 13-ene-2026: la validación de claves vive
  en código, no en constraints, para poder seguirlos.
advertencia: >
  El incumplimiento no es solo multa (CFF 84-IV-d, $450-$670 por CFDI): el
  traslado sin CFDI con complemento SE PRESUME CONTRABANDO (CFF 103-XXII,
  pena de 3 a 6 años, CFF 104-IV) y el gasto pierde deducción y acreditamiento
  (CFF 29-A). Por eso el clasificador NUNCA responde "no necesita" con datos
  faltantes: responde "falta declarar".
