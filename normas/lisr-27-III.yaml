id: lisr-27-fr-III
tipo: ley
jerarquia: 1
instrumento: "Ley del Impuesto sobre la Renta"
citas_en_codigo: ["LISR 27-III"]
articulo_o_regla: "27"
fraccion: "III"
texto_vigente: >
  Estar amparadas con un comprobante fiscal y que los pagos cuyo monto exceda de
  $2,000.00 se efectúen mediante transferencia electrónica de fondos desde cuentas
  abiertas a nombre del contribuyente en instituciones que componen el sistema
  financiero...; cheque nominativo de la cuenta del contribuyente, tarjeta de
  crédito, de débito, de servicios, o los denominados monederos electrónicos
  autorizados por el Servicio de Administración Tributaria.
  ---
  Tratándose de la adquisición de combustibles para vehículos marítimos, aéreos y
  terrestres, el pago deberá efectuarse en la forma señalada en el párrafo anterior,
  aun cuando la contraprestación de dichas adquisiciones no excedan de $2,000.00 y
  en el comprobante fiscal deberá constar la información del permiso vigente,
  expedido en los términos de la Ley de Hidrocarburos al proveedor del combustible
  y que, en su caso, dicho permiso no se encuentre suspendido, al momento de la
  expedición del comprobante fiscal.
