id: lfpdppp-2025-art-2-fr-XII-XX
tipo: ley
jerarquia: 1
instrumento: "Ley Federal de Protección de Datos Personales en Posesión de los Particulares"
articulo_o_regla: "2"
fraccion: "XII y XX"
titulo: "Persona encargada, y por qué mandarle datos NO es una transferencia"
citas_en_codigo: ["LFPDPPP 2-XII", "LFPDPPP 2-XX", "LFPDPPP 35"]
texto_vigente: >
  Artículo 2. [...]
  XII. Persona encargada: Persona física o jurídica que sola o conjuntamente con
  otras trate datos personales por cuenta del responsable;
  [...]
  XV. Secretaría: Secretaría Anticorrupción y Buen Gobierno;
  [...]
  XX. Transferencia: Toda comunicación de datos personales dentro o fuera del
  territorio mexicano, realizada a persona distinta de la titular, del
  responsable o de la persona encargada del tratamiento.

  Artículo 35. Cuando el responsable pretenda transferir los datos personales a
  terceros nacionales o extranjeros, distintos de la persona encargada deberá
  comunicar a éstos el aviso de privacidad y las finalidades a las que la persona
  titular sujetó su tratamiento.
fecha_publicacion: 2025-03-20
