fuente: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPDPPP.pdf (texto vigente, última reforma DOF 14-11-2025)"
nota_verificacion: >
  CORRIGE el análisis previo, que apoyaba la conclusión en la figura de
  "REMISIÓN". Esa palabra NO aparece ni una vez en la ley vigente: venía del
  Reglamento de la ley abrogada. Citarla ante un cliente es citar derecho
  derogado.

  La conclusión sobrevive, pero por otra vía y más fuerte: la definición misma de
  transferencia (fr. XX) EXCLUYE a la persona encargada. Mandarle datos a quien
  los trata por cuenta del responsable no es transferencia por definición legal,
  no por una figura reglamentaria. El art. 35 lo confirma al hablar de terceros
  "distintos de la persona encargada".

  Ojo también con la terminología: la ley vigente dice "persona encargada", no
  "encargado".
contexto_verificado: >
  Cadena real del proyecto: la FLOTA es responsable. LIKIDA es persona encargada.
  OPENROUTER es a quien Likida contrata, y Google/Anthropic/OpenAI están debajo
  de OpenRouter — Likida no contrata con ellos directamente.
impacto_en_producto: >
  Que no sea transferencia quita el requisito de consentimiento por esa vía, pero
  NO quita el pendiente contractual: hace falta que el contrato con la flota
  autorice la subcontratación y que el de OpenRouter cubra su propia cadena.

  Y el volumen de dato personal es menor de lo que parece: un ticket de diésel o
  de caseta trae datos fiscales de la EMPRESA. La exposición personal se
  concentra en los viáticos timbrados al RFC del operador.
