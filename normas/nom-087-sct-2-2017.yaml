nota_verificacion: >
  Creada el 27-ago-2026 junto con el registro de jornada (mig. 0241).

  OJO CON EL HOST: `www.dof.gob.mx` falla por certificado TLS; el que responde
  es `dof.gob.mx` sin www.

  Esta ficha existe para documentar un LÍMITE DEL PRODUCTO, no para alimentar un
  motor. Ver `impacto_en_producto`.
contexto_verificado: >
  Es de observancia obligatoria para el Servicio del Autotransporte Federal y
  sus servicios auxiliares en todas sus modalidades que transitan en caminos y
  puentes de jurisdicción federal, y para el transporte privado del art. 8 fr.
  XI de la Ley de Caminos.

  DOS CONFUSIONES QUE CUESTAN CARO, y las dos se verificaron leyendo el texto:

  1. El numeral 4.5 —segundo conductor cuando el trayecto excede 9 horas— NO
     APLICA A CARGA. Es exclusivo de pasaje, turismo y transporte privado de
     PASAJEROS. Aplicárselo a una flota de carga sería inventarle una obligación.
  2. La NOM mide TIEMPO DE CONDUCCIÓN; la LFT mide JORNADA, que el art. 58
     define como el tiempo a disposición del patrón. No son la misma magnitud y
     sus topes conviven mal: 14 h de conducción en 24 h (numeral 4.7) contra 12
     h de jornada ordinaria + extraordinaria (LFT art. 68, último párrafo). Un
     operador puede caber en la NOM y no caber en la LFT.
sin_criterio:
  - >
    LA TENSIÓN ENTRE LAS 14 H DE LA NOM Y LAS 12 H DEL ART. 68 DE LA LFT ES UNA
    LECTURA DE LOS DOS TEXTOS, NO UN CRITERIO DE AUTORIDAD. No se localizó
    jurisprudencia ni criterio administrativo que la resuelva. El producto NO la
    presenta como conclusión legal.
  - >
    NO SE VERIFICÓ el catálogo de sanciones por incumplir la NOM: su numeral 6.1
    solo remite genéricamente («dará lugar a sanciones de acuerdo a las
    disposiciones aplicables por la autoridad competente»). La única multa
    numérica confirmada del tema vive en el art. 83 del Reglamento de Tránsito
    (ver la ficha `reglamento-transito-83`).
  - >
    NO SE VERIFICÓ el numeral 4.2 de la NOM-012-SCT-2-2017, que la 087 cita como
    fuente concurrente del contenido de la bitácora. Podría añadir campos.
  - >
    La vigilancia que el numeral 7.1 asigna a «la SCT y la Secretaría de
    Gobernación a través de la Policía Federal» corresponde hoy a la SICT y a la
    Guardia Nacional (ver la reforma del Reglamento de Tránsito, DOF
    25-05-2026). El texto de la NOM no se ha actualizado.
impacto_en_producto: >
  ESTA FICHA EXISTE PARA QUE EL PRODUCTO SE CALLE, Y ESO ES SU VALOR.

  Likida registra JORNADA: a qué hora empezó y terminó el operador, y qué
  descansos hubo. NO registra CONDUCCIÓN EFECTIVA — no sabe cuántas de esas
  horas fueron volante y cuántas fueron esperar andén, cargar, o dormir en la
  litera. Los topes de la NOM (4.1, 4.6, 4.7) se miden sobre conducción, así que
  el motor de riesgo NO los evalúa y lo DICE, con esta frase, en la pantalla y
  en el reporte:

    «Este registro mide jornada, no tiempo de conducción. Los tiempos de la
     NOM-087-SCT-2-2017 se miden sobre conducción efectiva, que Likida no
     registra: no se emite juicio sobre ellos.»

  Estimarla a partir del GPS sería exactamente lo que la casa prohíbe: un
  «cumple» falso es peor que un hueco declarado, y aquí el hueco tiene nombre.

  Lo que sí aporta la ficha al producto: el numeral 8.5 fija DOS AÑOS de
  conservación de la bitácora de horas de servicio, plazo distinto del que el
  art. 804 de la LFT fija para el control de asistencia. El reporte exportable
  los enseña como dos plazos, no como uno.
