id: nom-087-sct-2-2017
tipo: regla_general
jerarquia: 3
instrumento: "NOM-087-SCT-2-2017 (Norma Oficial Mexicana)"
articulo_o_regla: "numerales 4.1 a 4.7, 8.2.1, 8.3.2 y 8.5"
titulo: "Tiempos de conducción y pausas del autotransporte federal — y por qué Likida no los evalúa"
citas_en_codigo: ["NOM-087-SCT-2-2017", "NOM-087 4.1", "NOM-087 4.6", "NOM-087 4.7", "NOM-087 8.5"]
texto_vigente: >
  4.1 Todo conductor debe realizar una pausa de 30 minutos cuando:
  a) Ha conducido hasta cinco horas continuas, o bien;
  b) Esta pausa podrá distribuirse durante un lapso de cinco horas y media de
  acuerdo a las condiciones de la ruta.

  4.2. Los periodos de pausa, en ningún caso podrán ser acumulables.

  4.3. Durante todo el tiempo de conducción, el conductor debe portar la
  Bitácora de Horas de Servicio y exhibirla a la autoridad competente cuando
  ésta le sea requerida; la cual debe ser de uso personal e intransferible. El
  registro de los datos de la bitácora se realizará en formatos impresos o
  electrónicos.

  4.4. Los permisionarios pueden aprovechar los dispositivos tecnológicos
  disponibles con el objeto de cumplir las disposiciones del presente
  ordenamiento, tales como el tacógrafo u otras aplicaciones electrónicas.

  4.5. El permisionario del autotransporte federal de pasaje y turismo y
  transporte privado de pasajeros, está obligado a considerar un segundo
  conductor cuando: a) El tiempo de trayecto de la ruta exceda las 9 horas.
  [...]

  4.6. En el autotransporte de carga, deben organizar las rutas considerando lo
  siguiente: a) En rutas que impliquen una conducción máxima de 14 horas, el
  conductor debe tener una pausa no menor a 8 horas continuas, sin menoscabo de
  cumplir con las pausas mínimas establecidas en los numerales 4.1 y 4.2 de la
  presente Norma.

  4.7. El tiempo máximo de conducción en 24 horas nunca podrá exceder las 14
  horas.

  8.3.2 En la bitácora se revisarán: que cumpla con la portación de la misma y
  con los contenidos que establecen el Reglamento de Tránsito en Carreteras y
  Puentes de Jurisdicción Federal, se verificará que las horas máximas de
  conducción en 24 horas no excedan las 14 horas; pausas cada 30 minutos por
  cada 5 horas de conducción o su distribución en un lapso de 5 horas y media; y
  las 8 horas de pausa obligatorias para cada 14 horas de conducción en 24
  horas.

  8.5. La bitácora de horas de servicio podrá llevarse de manera impresa o en
  medios electrónicos, para ser exhibida ante la autoridad competente y deberán
  ser conservadas al menos durante dos años.
