# ── LA DEFINICIÓN QUE FALTABA EN ESTA FICHA (agregada 15-ago-2026) ───────────
# El párrafo que precede a la fracción V define "transporte privado" PARA AMBAS
# fracciones (IV y V). No estaba transcrito aquí, y es la pieza que decide si
# una flota que NO es transportista entra o no al estímulo. Extraído del PDF
# oficial de la Cámara de Diputados (LIF_2026.pdf, art. 20 en la línea 1143 del
# texto plano; la definición en la 1326).
definicion_transporte_privado:
  texto_vigente: >
    Para los efectos de la presente fracción y la fracción V de este apartado, se
    entiende por transporte privado de personas o de carga, aquel que realizan las
    personas contribuyentes con vehículos de su propiedad o con vehículos que tengan
    en arrendamiento, incluido el arrendamiento financiero, para transportar bienes
    propios o su personal, o bienes o personal, relacionados con sus actividades
    económicas, sin que por ello se genere un cobro.
  por_que_importa: >
    La ley DEFINE transporte privado como mover BIENES PROPIOS O PERSONAL PROPIO,
    con vehículos propios o arrendados, sin cobrar por ello. Eso es exactamente una
    embotelladora repartiendo su refresco, un mayorista de abarrotes surtiendo
    tiendas, una farmacéutica distribuyendo medicamento, y una maquiladora moviendo
    a sus trabajadores. **Ninguna de esas empresas está en SCIAN 484**, así que el
    mercado de Likida es mucho más grande que el padrón de autotransportistas.
    Incluye también el arrendamiento financiero, que es como muchas flotas grandes
    tienen sus unidades.
  verificado_el: 2026-08-15
  fuente: "PDF oficial diputados.gob.mx/LeyesBiblio/pdf/LIF_2026.pdf, art. 20 apartado A, párrafo previo a la fracción V"

# ── DÓNDE SÍ Y DÓNDE NO APLICA CADA ESTÍMULO (el matiz que cambia el pitch) ──
# Los dos estímulos usan la palabra "exclusivamente", pero la cuelgan de cosas
# DISTINTAS, y ahí está toda la diferencia comercial:
#
#   IEPS (fr. IV): "...en VEHÍCULOS QUE SE DESTINEN exclusivamente al transporte
#   público y privado, de personas o de carga, así como el turístico".
#   El "exclusivamente" califica al VEHÍCULO. Un camión de reparto de una
#   embotelladora es un vehículo destinado exclusivamente a transportar carga.
#   ⇒ SÍ APLICA a flota privada, a transporte de personal, y a pasajeros.
#
#   PEAJE (fr. V): "...personas contribuyentes QUE SE DEDIQUEN exclusivamente al
#   transporte terrestre público y privado, de carga o pasaje...".
#   El "exclusivamente" califica al CONTRIBUYENTE. Una embotelladora se dedica a
#   hacer bebidas, no exclusivamente a transportar.
#   ⇒ NO APLICA a la flota privada de una empresa que vive de otra cosa.
#
# Y la trampa que cierra la puerta por el otro lado: un grupo que separe su flota
# en una filial ("Transportes XYZ") para cumplir el "exclusivamente" queda fuera
# por la exclusión de PARTES RELACIONADAS (LISR 179) que la misma fracción V
# impone. Sumado al tope de ingresos < $300M, el estímulo de peaje está
# prácticamente vedado para el segmento corporativo grande.
aplicabilidad_por_segmento:
  ieps_diesel_fr_IV:
    aplica_a: >
      Autotransporte de carga federal; transporte de pasajeros (público y privado);
      transporte turístico; FLOTA PRIVADA de cualquier industria que mueva bienes
      propios o personal propio (embotelladoras, abarrotes, farmacéuticas, gas y
      combustibles, construcción, agroindustria, paquetería, residuos, personal).
    no_aplica_a: >
      Quien use el diésel en maquinaria fija o en actividades agropecuarias — ésos
      van por las fracciones I y II, que EXCLUYEN expresamente el autotransporte por
      carretera (ver hallazgo H7 abajo). No confundir las dos vías.
  peaje_50_fr_V:
    aplica_a: >
      Solo quien SE DEDIQUE EXCLUSIVAMENTE al transporte terrestre (público, privado
      o turístico), con ingresos anuales < $300M y sin ser parte relacionada.
      En la práctica: transportistas puros, chicos y medianos.
    no_aplica_a: >
      La flota privada de una empresa cuyo giro es otro; los grandes por el tope de
      $300M; y las filiales de transporte de un grupo, por partes relacionadas.
  consecuencia_comercial: >
    El pitch NO es el mismo para los dos mercados y no debe presentarse igual. Al
    transportista puro chico/mediano se le venden LOS DOS estímulos. A la flota
    privada grande se le vende el de IEPS de diésel (que sobre volúmenes de miles
    de litros al mes es el grande de los dos), más deducibilidad, IVA acreditable,
    69-B y control de viáticos — pero NO se le promete el 50% de peaje. Prometerlo
    sería exactamente el tipo de cifra inventada que la regla del producto prohíbe,
    y con un contribuyente auditado se paga caro.

estimulo_diesel_transporte:
  texto_vigente: >
    Se otorga un estímulo fiscal a las personas contribuyentes que importen o
    adquieran diésel o biodiésel y sus mezclas para su consumo final y que sea para
    uso automotriz en vehículos que se destinen exclusivamente al transporte público
    y privado, de personas o de carga, así como el turístico, consistente en permitir
    el acreditamiento de un monto equivalente al impuesto especial sobre producción y
    servicios que las personas que enajenen diésel o biodiésel y sus mezclas en
    territorio nacional hayan causado por la enajenación de estos combustibles...
    ---
    el monto que se podrá acreditar será el que resulte de multiplicar la cuota del
    impuesto especial sobre producción y servicios que corresponda según el tipo de
    combustible... con los ajustes que, en su caso, correspondan, vigente en el
    momento en que se haya realizado la importación o adquisición del diésel..., por
    el número de litros importados o adquiridos.
  como_se_calcula: "cuota IEPS vigente al momento de la compra × LITROS. No es el IEPS trasladado en el CFDI."
  advertencia_critica: >
    "con los ajustes que, en su caso, correspondan" es la cuota DISMINUIDA, y la
    cuota cambia SEMANALMENTE. Ver criterio-1-LIF-PI: usar la cuota entera es
    práctica indebida que alcanza a quien presta el servicio.

estimulo_peaje:
  texto_vigente: >
    Se otorga un estímulo fiscal a las personas contribuyentes que se dediquen
    exclusivamente al transporte terrestre público y privado, de carga o pasaje, así
    como el turístico, que utilizan la Red Nacional de Autopistas de Cuota, que
    obtengan en el ejercicio fiscal en el que hagan uso de la infraestructura
    carretera de cuota, ingresos totales anuales para los efectos del impuesto sobre
    la renta menores a 300 millones de pesos, consistente en permitir un
    acreditamiento de los gastos realizados en el pago de los servicios por el uso de
    la infraestructura mencionada hasta en un 50 por ciento del gasto total erogado
    por este concepto. El estímulo será aplicable únicamente cuando se cumplan con
    los requisitos que mediante reglas de carácter general establezca el Servicio de
    Administración Tributaria. El estímulo no podrá ser aplicable por las personas
    morales que se consideran partes relacionadas de acuerdo con el artículo 179 de
    la Ley del Impuesto sobre la Renta.
  condiciones:
    - "Dedicarse EXCLUSIVAMENTE al transporte terrestre de carga, pasaje o turístico"
    - "Usar la RED NACIONAL DE AUTOPISTAS DE CUOTA (no cualquier caseta)"
    - "Ingresos totales anuales del ejercicio MENORES a $300,000,000"
    - "No ser parte relacionada (LISR art. 179)"

hallazgos_que_el_codigo_tiene_MAL:
  - id: H4
    que_dice_la_ley: "hasta en un 50 por ciento del GASTO TOTAL EROGADO por este concepto"
    que_hace_el_motor: "peajeAcreditable += g.subTotal * 0.5 — usa el SubTotal SIN IVA."
    por_que_importa: >
      "Gasto total erogado" es lo pagado, no la base sin impuesto. Con IVA al 16%, la
      diferencia es ~13.8% menos de estímulo del que corresponde. CONFLICTO: usar el
      total podría duplicar el beneficio del IVA, que ya se acredita por separado
      (LIVA art. 5). Esta es una pregunta para un contador, NO para resolverse sola.
    severidad: alta
    estado: >
      RESUELTO (14-ago-2026): la RMF 2026 regla 9.1.8, fr. IV (ficha
      rmf-2026-9.1.8, verificada en fuente primaria) fija la base: "se aplicará
      al importe pagado por concepto del uso de la infraestructura carretera de
      cuota, sin incluir el IVA, el factor de 0.5". La lectura conservadora del
      motor es la que la regla ordena — no hay que cambiar el código.
  - id: H5
    que_dice_la_ley: "que utilizan la Red Nacional de Autopistas de Cuota"
    que_hace_el_motor: "Aplica el 50% a TODO gasto con concepto 'caseta'."
    por_que_importa: >
      Una caseta estatal o municipal fuera de la Red Nacional no da el estímulo. El
      motor lo estaría acreditando de más.
    severidad: media
  - id: H6
    que_dice_la_ley: "ingresos totales anuales menores a 300 millones; no partes relacionadas"
    que_hace_el_motor: "No conoce los ingresos de la flota ni su relación de partes."
    por_que_importa: "El estímulo se aplica sin verificar si el cliente califica."
    severidad: media
  - id: H7
    que_dice_la_ley: >
      El estímulo de la fracción I (diésel para maquinaria, ingresos < $60M) NO
      aplica: "Los derechos previstos en esta fracción y en la fracción II de este
      apartado no serán aplicables a las personas contribuyentes que utilicen el
      diésel... en bienes destinados al autotransporte de personas o efectos a través
      de carreteras o caminos".
    que_hace_el_motor: "No los confunde hoy, pero el material comercial sí puede."
    severidad: baja
verificado_el: 2026-07-27
usado_en_codigo:
  - "config.ts — estimulos.peajeFactor (0.5), estimulos.clavesDieselIeps"
  - "cuadre/engine.ts — peajeAcreditable (50% del SubTotal de casetas); iepsAcreditable queda en 0 a propósito y el dato duro es litrosDieselAcreditables (cuota semanal × litros, la cuota la pone el contador)"
  - "liquidacion/acreditable.ts — arma la sección ACREDITABLE / RECUPERABLE: BASE_ESTIMULO_PEAJE (el hallazgo H4 dicho en el papel) y CONDICIONES_ESTIMULO_PEAJE (las cuatro condiciones de esta ficha)"
  - "liquidacion/pdf.ts — dibuja esa sección (filasAcreditables)"
