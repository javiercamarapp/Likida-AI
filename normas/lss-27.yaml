id: lss-27
tipo: ley
jerarquia: 1
instrumento: "Ley del Seguro Social"
articulo_o_regla: "27"
titulo: "Salario base de cotización — y el hallazgo de que los VIÁTICOS no están entre las exclusiones"
citas_en_codigo: ["LSS 27", "art. 27 LSS", "salario base de cotización"]
texto_vigente: >
  Artículo 27. El salario base de cotización se integra con los pagos hechos en
  efectivo por cuota diaria, gratificaciones, percepciones, alimentación,
  habitación, primas, comisiones, prestaciones en especie y cualquiera otra
  cantidad o prestación que se entregue al trabajador por su trabajo. Se excluyen
  como integrantes del salario base de cotización, dada su naturaleza, los
  siguientes conceptos:
  I. Los instrumentos de trabajo tales como herramientas, ropa y otros similares;
  II. El ahorro, cuando se integre por un depósito de cantidad semanaria,
  quincenal o mensual igual del trabajador y de la empresa [...];
  III. Las aportaciones adicionales que el patrón convenga otorgar a favor de sus
  trabajadores por concepto de cuotas del seguro de retiro, cesantía en edad
  avanzada y vejez;
  IV. Las cuotas que en términos de esta Ley le corresponde cubrir al patrón, las
  aportaciones al INFONAVIT, y las participaciones en las utilidades de la empresa;
  V. La alimentación y la habitación cuando se entreguen en forma onerosa [...];
  VI. Las despensas en especie o en dinero [...] que no rebase el cuarenta por
  ciento del salario mínimo [...];
  VII. Los premios por asistencia y puntualidad [...];
  VIII. Las cantidades aportadas para fines sociales [...], y
  IX. El tiempo extraordinario dentro de los márgenes señalados en la Ley Federal
  del Trabajo.
  ---
  "Para que los conceptos mencionados en este precepto se excluyan como
  integrantes del salario base de cotización, deberán estar debidamente
  registrados en la contabilidad del patrón."
fecha_publicacion: 1995-12-21
fecha_vigencia_desde: 2009-01-16
