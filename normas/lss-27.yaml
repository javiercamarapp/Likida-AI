el_hallazgo_que_cambia_el_diseno:
  que_se_creia: >
    Que los viáticos estaban excluidos del salario base de cotización por una
    fracción del artículo 27, como lo repite casi toda la literatura de despachos.
  que_dice_la_ley: >
    NO EXISTE tal fracción. La palabra "viático" aparece UNA sola vez en las 181
    páginas de la Ley del Seguro Social, y es en el artículo 56 fracción VII
    (gastos de traslado de un trabajador accidentado). El artículo 27 no la usa.
  por_que_es_grave: >
    Porque el artículo 9 de la misma Ley ordena: "Las disposiciones fiscales de
    esta Ley que establecen cargas a los particulares Y LAS QUE SEÑALAN
    EXCEPCIONES A LAS MISMAS... son de APLICACIÓN ESTRICTA. Se considera que
    establecen cargas las normas que se refieran a sujeto, objeto, BASE DE
    COTIZACIÓN y tasa." Una exclusión que no está escrita no se puede invocar por
    analogía.
  la_consecuencia_correcta: >
    El anticipo que Likida despacha a un operador NO se salva por vía de
    exclusión, porque no hay fracción que lo ampare. Sólo se salva si NO ENTRA al
    primer párrafo, es decir, si se acredita que no es "cantidad o prestación que
    se entregue al trabajador POR SU TRABAJO", sino un gasto del patrón erogado
    por conducto del trabajador. Es una defensa de naturaleza, no de excepción, y
    se gana o se pierde con la COMPROBACIÓN DEL DESTINO.

