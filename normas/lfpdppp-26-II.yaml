nota_verificacion: >
  CORRIGE la conclusión de la ola 1, que decía que el artículo "obliga a
  intervención humana en decisiones automatizadas". No dice eso: es un derecho de
  OPOSICIÓN del titular, no una obligación proactiva del responsable. La
  diferencia importa para no venderle a la flota un requisito que la ley no le
  impone.

  Lo que sí se sigue del texto, y a favor del diseño actual: el supuesto de la
  fracción II exige que la evaluación ocurra "sin intervención humana". Mientras
  el contralor sea quien decide sobre la liquidación, el supuesto no se activa.

  Se detectó además una reforma POSTERIOR a la que registraba el proyecto: DOF
  14-nov-2025, no solo la publicación del 20-mar-2025.
contexto_verificado: >
  Ley NUEVA publicada en el DOF el 20-mar-2025, texto vigente con última reforma
  DOF 14-nov-2025. La autoridad es la Secretaría Anticorrupción y Buen Gobierno
  (art. 2 fr. XV); el INAI no aparece en la ley vigente.
impacto_en_producto: >
  La bandeja del contralor deja de ser solo una comodidad: es lo que mantiene el
  cuadre fuera del supuesto de la fracción II. Un modo "cierra solo, sin que
  nadie mire" sí metería a la flota en ese supuesto, porque el cuadre evalúa
  gastos del operador y de ahí puede salir un descuento de nómina — "rendimiento
  profesional", "situación económica" y "fiabilidad" están literalmente en la
  lista del artículo.

  No construir cierre automático sin revisión humana sin volver aquí.
