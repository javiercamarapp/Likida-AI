nota_verificacion: >
  La síntesis de la ola 1 concluye que obliga a intervención humana en decisiones
  automatizadas que afecten al titular. El texto NO se transcribió. PARA CERRAR:
  bajar la LFPDPPP vigente (DOF 20-mar-2025) de diputados.gob.mx y transcribir el
  artículo 26 completo, confirmando el alcance de la fracción II.
contexto_verificado: >
  La nueva LFPDPPP entró en vigor el 21-mar-2025. El INAI desapareció y sus
  funciones pasaron a la Secretaría de Anticorrupción y Buen Gobierno. Los datos
  financieros y patrimoniales exigen consentimiento EXPRESO, y ya no valen las
  "finalidades análogas o compatibles".
impacto_en_producto: >
  Si aplica, el contralor no puede ser sustituido por el motor en la decisión final:
  la bandeja de excepciones deja de ser una comodidad y pasa a ser un requisito.
