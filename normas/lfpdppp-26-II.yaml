id: lfpdppp-2025-art-26-fr-II
tipo: ley
jerarquia: 1
instrumento: "Ley Federal de Protección de Datos Personales en Posesión de los Particulares"
articulo_o_regla: "26"
fraccion: "II"
titulo: "Derecho de OPOSICIÓN al tratamiento automatizado sin intervención humana"
citas_en_codigo: ["LFPDPPP 26-II"]
texto_vigente: >
  Artículo 26. La persona titular tendrá derecho en todo momento y por causa
  legítima a oponerse al tratamiento de sus datos o exigir que se cese en el
  mismo cuando:

  I. Exista causa legítima y su situación específica así lo requiera, lo cual
  debe justificar que aun siendo lícito el tratamiento, el mismo debe cesar para
  evitar que su persistencia le cause un daño o perjuicio, o

  II. Sus datos personales sean objeto de un tratamiento automatizado, el cual le
  produzca efectos jurídicos no deseados o afecte de manera significativa sus
  intereses, derechos o libertades, y estén destinados a evaluar, sin
  intervención humana, determinados aspectos personales de la misma o analizar o
  predecir, en particular, su rendimiento profesional, situación económica,
  estado de salud, preferencias sexuales, fiabilidad o comportamiento.

  No procederá el ejercicio del derecho de oposición en aquellos casos en los que
  el tratamiento sea necesario para el cumplimiento de una obligación legal
  impuesta al responsable.
