nota_verificacion: >
  Transcrito el 28-jul-2026 del PDF oficial de la Cámara de Diputados, TEXTO VIGENTE,
  última reforma publicada DOF 09-04-2026 (arts. 89 y 90, pp. 174-175 de 377).

  Los IMPORTES de la multa del art. 90 se ACTUALIZAN: el propio documento anota
  "Multa del párrafo compilada por resolución miscelánea fiscal DOF 05-01-2022.
  Actualizada DOF 27-12-2022. Compilada DOF 29-12-2023, 30-12-2024. Actualizada DOF
  28-12-2025". Los $79,130.00 a $124,380.00 son los del texto vigente al 09-04-2026.
  El producto NO debe imprimir estas cifras sin fecharlas: se mueven cada año.
por_que_nos_toca: >
  Es la posición de LIKIDA, no la del cliente. El art. 89 fr. I sanciona "asesorar,
  aconsejar o PRESTAR SERVICIOS para omitir total o parcialmente el pago de alguna
  contribución en contravención a las disposiciones fiscales", y un motor que calcula
  mal un estímulo y lo imprime citando la ley es exactamente eso. Es el mismo alcance
  que la fracción de cierre de los criterios del Anexo 3 (ver criterio-1-CFF-PI).
mitigacion: >
  LA MITIGACIÓN ESTÁ EN EL ÚLTIMO PÁRRAFO DEL PROPIO ART. 89, y es literal: no se
  incurre en la infracción de la fracción I "cuando se manifieste... POR ESCRITO al
  contribuyente que su asesoría puede ser contraria a la interpretación de las
  autoridades fiscales".

  Eso es exactamente lo que hace `cuadre/leyendas.ts`: LEYENDA_CORTA dice "puede
  diferir de los criterios que dé a conocer el SAT" y `leyendaPdf()` lo repite en el
  documento que se archiva. La leyenda no es adorno legal: es la conducta que el
  artículo nombra para no caer en la infracción, y por eso tiene que ir POR ESCRITO y
  en el papel, no solo en la conversación.

  El agravante del art. 90, 2º párrafo, apunta al mismo lugar: la multa sube de 10% a
  20% de la contribución omitida cuando el criterio es DIVERSO al del SAT. Otra razón
  para que la frase "puede diferir de los criterios que dé a conocer el SAT" esté
  escrita y no implícita.
