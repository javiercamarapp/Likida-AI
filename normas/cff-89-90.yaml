id: cff-89-90
tipo: ley
jerarquia: 1
instrumento: "Código Fiscal de la Federación"
articulo_o_regla: "89 y 90"
titulo: "Infracciones cuya responsabilidad recae sobre TERCEROS, y su multa — la exposición de Likida"
citas_en_codigo: ["CFF 89", "CFF 90", "CFF arts. 89 y 90"]
texto_vigente: >
  Artículo 89. Son infracciones cuya responsabilidad recae sobre terceros, las
  siguientes:

  I. Asesorar, aconsejar o prestar servicios para omitir total o parcialmente el pago
  de alguna contribución en contravención a las disposiciones fiscales.

  II. Colaborar en la alteración o la inscripción de cuentas, asientos o datos falsos
  en la contabilidad o en los documentos que se expidan.

  III. Ser cómplice en cualquier forma no prevista, en la comisión de infracciones
  fiscales.

  IV. Al que permita o publique a través de cualquier medio, anuncios para la
  adquisición o enajenación de comprobantes fiscales que amparen operaciones
  inexistentes, falsas o actos jurídicos simulados.

  No se incurrirá en la infracción a que se refiere la fracción primera de este
  artículo, cuando se manifieste en la opinión que se otorgue por escrito que el
  criterio contenido en ella es diverso a los criterios dados a conocer por las
  autoridades fiscales en los términos del inciso h) de la fracción I del artículo 33
  de este Código o bien manifiesten también por escrito al contribuyente que su
  asesoría puede ser contraria a la interpretación de las autoridades fiscales.

  ---

  Artículo 90. Se sancionará con una multa de $79,130.00 a $124,380.00, a quien cometa
  las infracciones a las disposiciones fiscales a que se refiere el artículo 89 de este
  Código.

  En los supuestos señalados en la fracción I del artículo citado, se considerará como
  agravante que la asesoría, el consejo o la prestación de servicios sea diversa a los
  criterios dados a conocer por las autoridades fiscales en los términos del inciso h)
  de la fracción I del artículo 33 de este Código. En este caso, la multa se aumentará
  de un 10% a un 20% del monto de la contribución omitida [...]
fecha_publicacion: 1981-12-31
