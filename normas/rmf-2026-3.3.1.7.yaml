nota_verificacion: >
  Texto transcrito de docs/conocimiento/09-liquidacion.md ("texto literal" de la
  RMF 2026, regla 3.3.1.7), verificado allí contra el PDF del SAT
  (DOF 28-dic-2025). Esta ficha no re-descargó el PDF en la sesión que la creó
  (23-ago-2026): por eso el estado es evidencia_corroborante, no
  verificado_fuente_primaria. La Primera Resolución de Modificaciones
  (DOF 09-jul-2026) no tocó esta regla (09-liquidacion.md:41).
cambio_de_numero: false
por_que_importa_al_producto: >
  El ticket fotografiado en la bomba de una carga pagada con monedero NO es el
  comprobante deducible: la gasolinera tiene prohibido facturarlo. El motor no
  puede tratarlo como "todavía puede llegar su factura de estación". El
  comprobante es el CFDI del emisor del monedero con el complemento ECC.
