id: rfa-2026-2.9
tipo: rfa
jerarquia: 3
instrumento: "Resolución de Facilidades Administrativas para 2026"
articulo_o_regla: "2.9"
titulo: "Adquisición de combustibles"
citas_en_codigo: ["RFA 2026 regla 2.9"]
texto_vigente: >
  Los contribuyentes personas físicas o morales, dedicados exclusivamente al
  autotransporte terrestre de carga federal, que tributen conforme al Título II,
  Capítulo VII o Título IV, Capítulo II, Sección I de la Ley del ISR, considerarán
  cumplida la obligación establecida en el artículo 27, fracción III, segundo
  párrafo de la Ley del ISR, cuando los pagos por consumo de combustible se
  realicen con medios distintos a cheque nominativo de la cuenta del contribuyente;
  tarjeta de crédito, de débito o de servicios; o monederos electrónicos autorizados
  por el SAT, siempre que estos no excedan el 15 por ciento del total de los pagos
  efectuados por consumo de combustible para realizar su actividad. Además, en el
  comprobante fiscal deberá constar la información del permiso vigente, expedido de
  acuerdo con la Ley de Hidrocarburos al proveedor del combustible y que, en su
  caso, dicho permiso no se encuentre suspendido en el momento de la expedición del
  comprobante fiscal.
