nota_verificacion: >
  Creada el 28-jul-2026. El motor YA decidía "no deducible" duro con este
  fundamento —`engine.ts`, tipos `cfdi_efos` y `cfdi_efos_indeterminado`— y no
  había ficha: se estaba tirando una deducción entera sobre una norma que nadie
  había transcrito.

  Lo que el texto sí dice: publicado el listado definitivo, las operaciones de
  esos comprobantes "no producen ni produjeron efecto fiscal alguno", con
  efectos generales. De ahí que el veredicto sea duro y no "por confirmar".

  Lo que NO dice, y el producto no debe insinuar: que el receptor pierda
  automáticamente y sin remedio. El propio artículo le da a quien recibió el
  comprobante un plazo para acreditar que la operación existió de verdad, o para
  corregir su situación. El motor no modela ese plazo hoy.
contexto_verificado: >
  Es la base del listado del art. 69-B que Likida consulta. El estado
  "presunto" (listado provisional) y el "definitivo" tienen efectos distintos, y
  el producto los distingue con `cfdi_efos_indeterminado`.
impacto_en_producto: >
  Es el veredicto más severo que emite el motor. Con ficha, `guardiaFundamento`
  puede dejar que el agente lo cite; sin ella, el agente no podía fundamentar el
  veredicto más caro que da.
