contexto_verificado: >
  LOS DOS TOPES QUE EL MOTOR SÍ PUEDE CITAR, y no se confunden:

  · Art. 61 — el tope de la jornada ORDINARIA por día, y depende del TIPO de
    jornada que el art. 60 define por reloj: ocho horas la diurna (06:00-20:00),
    siete la nocturna (20:00-06:00), siete y media la mixta; y la mixta se
    reputa NOCTURNA si el tramo nocturno llega a tres horas y media.
  · Art. 68, último párrafo — el tope DURO del día, ordinaria + extraordinaria:
    «en ningún caso podrá ser mayor a doce horas diarias». Es el único tope
    diario absoluto de la ley y no depende del tipo de jornada.

  EL TOPE SEMANAL NO ES EL DEL ARTÍCULO. El art. 59 ya dice 40 horas, pero el
  Transitorio Segundo del decreto lo escalona por año calendario, y el Cuarto
  hace lo mismo con las extras del art. 66:

    año | jornada ordinaria semanal | horas extra semanales
    2026|            48             |          9
    2027|            46             |          9
    2028|            44             |         10
    2029|            42             |         11
    2030|            40             |         12

  «A partir del 1 de enero» de cada año. Un motor que hardcodee 40 h estaría
  aplicando en 2026 una regla que no es exigible hasta 2030 — el error más fácil
  de cometer con esta reforma, y el más caro, porque marca en rojo a una flota
  que va en regla.

  LA INCONGRUENCIA DEL 784 fr. VIII, verificada y NO resuelta: el art. 66 ya
  permite doce horas extras semanales, pero el 784 fr. VIII sigue diciendo
  «cuando ésta no exceda de nueve horas semanales» — el decreto del 01-05-2026
  no lo tocó. El producto NO debe afirmar que la carga de la prueba cubre hasta
  doce: el texto vigente dice nueve.
impacto_en_producto: >
  Es el fundamento de la migración 0241 y de todo el registro de jornada.

  El tercer párrafo de la fracción XXXIV mandó una decisión de diseño concreta:
  el registro «hará prueba plena si se acredita que fue acordado entre la
  persona trabajadora y empleadora», así que `jornada_dia` guarda la
  CONFORMIDAD DEL OPERADOR con el id del mensaje de WhatsApp que la acredita.
  Sin ese acuerdo el registro sigue siendo válido, pero no es prueba plena, y el
  reporte lo dice en vez de dejar que la flota lo suponga.

  El 804 fr. III y el 805 mandaron la otra: `jornada_dia.operador_id` es
  `on delete restrict`. Dar de baja a un chofer no puede borrar el documento que
  la ley obliga a conservar «durante el último año y un año después de que se
  extinga la relación laboral» — sería destruir justo la prueba cuya ausencia el
  805 castiga con una presunción en contra.

  LO QUE EL MOTOR NO DICE, Y ESTÁ ESCRITO EN EL CÓDIGO: nunca emite «cumple».
  Emite EXCESO (contra un tope citado, con su artículo) o DATO INSUFICIENTE. La
  presunción del 805 admite prueba en contrario («salvo la prueba en
  contrario»), así que tampoco se le dice a nadie que «pierde automáticamente».
sin_criterio:
  - >
    El art. 64 computa como jornada efectiva el reposo del que el trabajador no
    puede salir. Likida no tiene forma de saber si un chofer podía o no salir de
    la caseta donde comió: los descansos se registran como los declara él, y el
    contralor decide. El producto no lo estima.
  - >
    Las disposiciones de carácter general de la STPS que la propia fracción
    XXXIV anuncia —ámbito de aplicación y excepciones— entran en vigor el
    1-ene-2027 por su Transitorio Quinto y AL 27-AGO-2026 NO SE LOCALIZARON
    publicadas en el DOF. El producto no implementa campos, formatos ni
    excepciones de esas disposiciones: no existen todavía como fuente
    verificable.
