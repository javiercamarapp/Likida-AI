id: lft-132-XXXIV-jornada
tipo: ley
jerarquia: 1
instrumento: "Ley Federal del Trabajo"
articulo_o_regla: "132 fr. XXXIV, 58 a 69, 784, 804, 805 y 994 fr. IV Bis"
titulo: "El registro electrónico de la jornada, los topes de horas, y qué pasa si el patrón no lo exhibe"
citas_en_codigo: ["LFT 132-XXXIV", "LFT 58", "LFT 60", "LFT 61", "LFT 63", "LFT 64", "LFT 68", "LFT 69", "LFT 784", "LFT 804", "LFT 805", "LFT 994-IV Bis"]
texto_vigente: >
  Artículo 132.- Son obligaciones de las personas empleadoras:

  XXXIV. Registrar de manera electrónica la jornada laboral de cada persona
  trabajadora, incluyendo el horario de inicio y finalización; así como
  proporcionarlo a la autoridad cuando se le requiera.

  La Secretaría del Trabajo y Previsión Social expedirá las disposiciones de
  carácter general que determinen el ámbito de aplicación y excepción a la
  obligación establecida en el párrafo que antecede.

  El contenido del registro electrónico hará prueba plena si se acredita que
  fue acordado entre la persona trabajadora y empleadora.

  Artículo 58.- Jornada de trabajo es el tiempo durante el cual el trabajador
  está a disposición del patrón para prestar su trabajo. Esta podrá ser
  distribuida de común acuerdo por las personas empleadoras y trabajadoras.

  Artículo 59.- La duración máxima de la jornada ordinaria de trabajo será de
  cuarenta horas semanales.

  Artículo 60.- Jornada diurna es la comprendida entre las seis y las veinte
  horas. Jornada nocturna es la comprendida entre las veinte y las seis horas.
  Jornada mixta es la que comprende períodos de tiempo de las jornadas diurna y
  nocturna, siempre que el período nocturno sea menor de tres horas y media,
  pues si comprende tres y media o más, se reputará jornada nocturna.

  Artículo 61.- La duración de la jornada diaria será de ocho horas la diurna,
  siete la nocturna y siete horas y media la mixta.

  Artículo 63.- Durante la jornada continua de trabajo se concederá al
  trabajador un descanso de media hora, por lo menos.

  Artículo 64.- Cuando el trabajador no pueda salir del lugar donde presta sus
  servicios durante las horas de reposo o de comidas, el tiempo correspondiente
  le será computado como tiempo efectivo de la jornada de trabajo.

  Artículo 66.- La jornada de trabajo podrá prolongarse por circunstancias
  extraordinarias. En estos casos, se abonará como salario por este tiempo un
  cien por ciento más de lo fijado para las horas ordinarias. El trabajo
  extraordinario no excederá de doce horas en una semana, las cuales podrán
  distribuirse en hasta cuatro horas diarias, en un máximo de cuatro días en
  ese periodo.

  Artículo 68.- Las personas trabajadoras no están obligadas a prestar sus
  servicios por un tiempo mayor del permitido en este capítulo. La prolongación
  del tiempo extraordinario que supere lo establecido en el artículo 66 de esta
  Ley, no podrá ser mayor de cuatro horas a la semana y obliga a la persona
  empleadora a pagar un doscientos por ciento más del salario que corresponda a
  las horas de la jornada ordinaria. La suma de las jornadas ordinaria y
  extraordinaria, en ningún caso podrá ser mayor a doce horas diarias.

  Artículo 69.- Por cada seis días de trabajo se deberá otorgar, por lo menos,
  un día de descanso con goce de salario íntegro.

  Artículo 784.- El Tribunal eximirá de la carga de la prueba al trabajador,
  cuando por otros medios esté en posibilidad de llegar al conocimiento de los
  hechos, y para tal efecto a petición del trabajador o de considerarlo
  necesario requerirá al patrón para que exhiba los documentos que, de acuerdo
  con las leyes, tiene la obligación legal de conservar en la empresa, bajo el
  apercibimiento de que, de no presentarlos, se presumirán ciertos los hechos
  alegados por el trabajador. En todo caso, corresponderá al patrón probar su
  dicho cuando exista controversia sobre: [...] III. Faltas de asistencia del
  trabajador; [...] VIII. Jornada de trabajo ordinaria y extraordinaria, cuando
  ésta no exceda de nueve horas semanales; [...] La pérdida o destrucción de los
  documentos señalados en este artículo, por caso fortuito o fuerza mayor, no
  releva al patrón de probar su dicho por otros medios.

  Artículo 804.- El patrón tiene obligación de conservar y exhibir en juicio los
  documentos que a continuación se precisan: [...] III. Controles de asistencia,
  cuando se lleven en el centro de trabajo; [...] Los documentos señalados en la
  fracción I deberán conservarse mientras dure la relación laboral y hasta un
  año después; los señalados en las fracciones II, III y IV, durante el último
  año y un año después de que se extinga la relación laboral; y los mencionados
  en la fracción V, conforme lo señalen las Leyes que los rijan.

  Artículo 805.- El incumplimiento a lo dispuesto por el artículo anterior,
  establecerá la presunción de ser ciertos los hechos que el actor exprese en su
  demanda, en relación con tales documentos, salvo la prueba en contrario.

  Artículo 994.- Se impondrá multa, por el equivalente a: [...] IV Bis. De 250 a
  5000 Unidades de Medida y Actualización, a la persona empleadora obligada que
  incumpla con lo dispuesto por la fracción XXXIV del artículo 132 de esta Ley.
