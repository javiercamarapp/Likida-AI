name: Backup Supabase Storage

on:
  # OPERABILIDAD-19C2-2: el `schedule` se quitó el 25-26 ago porque fallaba
  # TODAS las noches (03:17 UTC) al faltar el entorno `production-backup`
  # (secretos + bucket remoto). Ese entorno se configuró y la primera corrida
  # MANUAL salió verde el 23-oct-2026 (run 40016280860; restauración con
  # SHA-256 verificado), así que el `schedule` está ACTIVO de nuevo.
  # Si una corrida falla, el job termina en rojo y GitHub avisa; nunca se
  # declara éxito sin destino remoto (falla cerrado). `workflow_dispatch`
  # sigue disponible para correrlo a mano.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # A37-L-02 (operabilidad): el rojo del respaldo tiene dueño (un issue), no solo un correo que se aprende a ignorar.
  issues: write

concurrency:
  group: storage-backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Storage + manifest + SHA-256
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail closed si faltan secretos o destino remoto
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REMOTE: ${{ secrets.RESPALDO_S3_DESTINO }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_URL" ] || { echo "::error::Falta NEXT_PUBLIC_SUPABASE_URL en el environment production-backup."; exit 1; }
          [ -n "$SUPABASE_KEY" ] || { echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY en el environment production-backup."; exit 1; }
          [ -n "$REMOTE" ] || { echo "::error::Falta RESPALDO_S3_DESTINO; no se permite declarar backup local como exitoso."; exit 1; }
          command -v jq >/dev/null || { echo "::error::jq no está disponible en el runner."; exit 1; }
          command -v aws >/dev/null || { echo "::error::AWS CLI no está disponible en el runner."; exit 1; }

      - name: Ejecutar backup verificable
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESPALDO_S3_DESTINO: ${{ secrets.RESPALDO_S3_DESTINO }}
          RESPALDO_BUCKETS: ${{ vars.RESPALDO_BUCKETS }}
          RESPALDO_REQUIRE_REMOTE: 'true'
          RESPALDO_ALLOW_EMPTY: ${{ vars.RESPALDO_ALLOW_EMPTY || 'false' }}
          RESPALDO_ROOT: ${{ runner.temp }}/likida-storage-backup-${{ github.run_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: bash scripts/respaldo-storage.sh "$RESPALDO_ROOT"

      - name: Publicar resumen sin datos de clientes
        if: success()
        run: |
          echo '### Backup Storage' >> "$GITHUB_STEP_SUMMARY"
          echo '- Resultado: **OK**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manifiesto y SHA-256 sincronizados al destino remoto configurado.' >> "$GITHUB_STEP_SUMMARY"
          echo '- El contenido de Storage no se publica como artifact de GitHub.' >> "$GITHUB_STEP_SUMMARY"

      # A37-L-02 (operabilidad): un respaldo nocturno que falla en rojo cada noche solo dejaba un correo de GitHub (el mismo
      # patrón de las 40 corridas rojas del pulso que nadie atendió). Ahora el PRIMER rojo abre un issue con etiqueta propia
      # (sin duplicar mientras siga abierto) y la primera corrida verde lo cierra.
      - name: Abrir issue si el respaldo falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          abierto=$(gh issue list --label respaldo-fallido --state open --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then echo "Ya hay un issue abierto (#$abierto); no se duplica."; exit 0; fi
          gh label create respaldo-fallido --color D93F0B --description 'El respaldo nocturno de Storage falló: no hay copia fresca' --force >/dev/null 2>&1 || true
          gh issue create --title 'El respaldo nocturno de Storage falló (sin copia fresca)' --label respaldo-fallido --body "$(printf 'El respaldo de Storage terminó en rojo: mientras no vuelva a verde NO hay copia fresca de la evidencia fiscal.\n\nCorrida: %s\n\nCausas probables: credencial S3 vencida (AWS_SESSION_TOKEN temporal), cambio de política del bucket o el job pasó de 45 min. Este issue se cierra solo cuando una corrida vuelva a salir verde.\n' "$RUN_URL")"

      - name: Cerrar el issue cuando el respaldo vuelve a verde
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          for n in $(gh issue list --label respaldo-fallido --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "El respaldo volvió a salir verde: $RUN_URL"
          done
