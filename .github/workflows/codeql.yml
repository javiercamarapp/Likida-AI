# P2 de la auditoría externa (15-ago-2026): supply chain / SAST.
#
# Análisis estático de GitHub sobre JS/TS — inyección, uso inseguro de
# regex, flujos de dato sin sanear entre lo que entra por WhatsApp/HTTP y lo
# que llega a una consulta o a un `eval`-like. Corre APARTE de `verificar` y
# de `ci-postgres.yml`: no comparte runner ni bloquea a ninguno de los dos,
# así que no les agrega ni un segundo.
#
# EN PUSH A master/main Y EN CADA PULL REQUEST, no en cada rama — a
# diferencia de `ci.yml` (que sí corre en todas: es barato y rápido). El
# análisis de CodeQL es más caro (build + consulta de un grafo), y lo que
# importa vigilar es lo que va a fusionarse, no cada commit intermedio de
# una rama de trabajo en curso. Semanal además, por si algo nuevo en las
# consultas de CodeQL encuentra algo en código que no cambió esta semana.
#
# ⚠️ 23-AGO-2026 — DESACTIVADO, y no por decisión de diseño: en este repo
# CodeQL no puede correr. Falla con "Code scanning is not enabled for this
# repository", y habilitarlo exige GitHub Advanced Security COMPRADA (la API
# responde 422 "Advanced security has not been purchased"). Llevaba días en
# rojo, y un check rojo permanente enseña al equipo a ignorar la pestaña
# entera — así fue como pasó desapercibido que CI Postgres también lo estaba.
#
# MIENTRAS TANTO el análisis estático de seguridad vive en el lint, que sí
# corre en cada push: `eslint-plugin-security` con las reglas elegidas una por
# una en `eslint.config.mjs` (eval, require dinámico, child_process, ReDoS,
# comparaciones de secretos sensibles al tiempo, aleatoriedad no criptográfica).
# Y lo que CodeQL vigilaría de las regex lo mide `regex_sin_redos.test.ts`,
# que en vez de adivinar por la forma prueba con entrada adversarial.
#
# PARA REACTIVARLO cuando se compre Advanced Security: habilitar Code scanning
# en Settings → Code security, y devolver los disparadores `push`/`pull_request`
# de abajo (hoy queda solo el manual, para poder probarlo sin ensuciar).
name: CodeQL

on:
  workflow_dispatch:
  # push:
  #   branches: [master, main]
  # pull_request:
    branches: [master, main]
  schedule:
    - cron: '17 4 * * 1' # lunes, hora de bajo tráfico — el minuto 17 evita la estampida de "en punto" que satura los runners compartidos de GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # para publicar los hallazgos en la pestaña Security
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Sin build manual: el análisis de JS/TS de CodeQL no necesita que el
      # proyecto compile (a diferencia de Java/Go/C#) — lee el fuente
      # directamente. `autobuild` existe para otros lenguajes; aquí sobra.
      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
