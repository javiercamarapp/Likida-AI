# CT-SEG-24: escaneo de secretos con gitleaks en cada PR y push a master/main,
# y semanal sobre TODO el historial. El repo es publico: un secreto que entra
# queda expuesto aunque se borre despues. La accion se fija por hash (no por
# etiqueta movil). Sin secretos de repositorio: solo lee contenido.
name: Secretos

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '41 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
