# P2 de la auditoría externa (15-ago-2026): supply chain.
#
# `dependency-review-action` es de GitHub y solo tiene sentido en un PR: lee
# el DIFF de dependencias entre la base y la rama (qué se agregó, qué se
# quitó) y reprueba si algo nuevo trae una vulnerabilidad conocida o una
# licencia fuera de lo permitido. Sin un diff que comparar no hay nada que
# revisar — por eso no corre en push directo a una rama, solo en
# pull_request. Segundos de duración: no compite en costo con nada más de
# este repo.
name: Dependency Review

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # LÍMITE CONOCIDO, sin resolver: `package.json` trae `"xlsx":
      # "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"` — no viene del
      # registro de npm. No se pudo probar en esta ronda (esta Action solo
      # corre dentro de GitHub, contra un PR real; no hay forma de
      # reproducirla en local) si `dependency-review-action` resuelve su
      # licencia/CVEs desde esa URL o si el PR que la toque sale con un falso
      # "no se pudo determinar la licencia". Si el primer PR real revienta
      # por esto, es este paquete — la esquina lo confirmaría.
      - name: Revisar dependencias nuevas del PR
        uses: actions/dependency-review-action@v5
        with:
          # Reprueba en cualquier severidad MODERADA o peor — el mismo
          # criterio que ya usa `npm audit` de facto en este repo (ver el
          # `overrides.sharp` de package.json, documentado por CVE de
          # severidad alta). Bajo eso sería ruido; sobre eso, tarde.
          fail-on-severity: moderate
