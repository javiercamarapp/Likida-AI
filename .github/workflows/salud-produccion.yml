# El consumidor de /api/health (auditoría 18, M18).
#
# La ruta nació en la auditoría 4 prometiendo que «un monitor pegándole a
# esto cada minuto convierte ese modo de falla en una alerta de minutos», y
# dos rondas después nadie la consumía: ni vercel.json, ni un workflow, ni
# DEPLOY.md. Y el campo `version` —el único detector de la deriva silenciosa
# del `ignoreCommand` (push sin [deploy] en el asunto = producción se queda
# atrás sin avisar)— no se comparaba contra nada.
#
# Dos disparadores, un solo job:
#   · schedule cada 30 min: producción contesta 200 con ok:true, o rojo.
#   · push a master: si el asunto del commit lleva [deploy], se espera hasta
#     10 minutos a que `version` sea el sha pusheado. Si no llega, rojo — con
#     el sha esperado y el que de verdad corre en el log.
# GitHub manda correo al dueño del repo cuando un workflow programado falla,
# así que esto es una alerta sin infraestructura nueva y sin secretos.
name: Salud de producción

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulso:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # ── AUDITORÍA 22, OP-C1 (CRÍTICO) ──────────────────────────────────
      # Este paso exigía `estado=ok` a secas. `descarga-sat` sin
      # LIKIDA_SAT_PROVEEDOR es un hueco de configuración DECLARADO —el cron
      # dice qué le falta y quién lo destraba— y degradaba el health, así que
      # el watchdog llevaba 30 corridas seguidas en rojo. Una muerte real de
      # cron se veía EXACTAMENTE igual que el ruido conocido: el único
      # detector automático de cron muerto no podía cambiar de color.
      #
      # Ahora se leen los dos campos. `checks.crons=config_ausente` se ANOTA y
      # deja pasar; un `degraded` de verdad (regresión o cron vencido) falla.
      - name: /api/health está healthy (un cron vencido falla; un hueco de config se anota)
        run: |
          set -u
          cuerpo=$(curl -sS --max-time 20 -w '\n%{http_code}' https://app.likida.ai/api/health) || { echo "::error::/api/health no contestó"; exit 1; }
          status=$(echo "$cuerpo" | tail -n1)
          json=$(echo "$cuerpo" | sed '$d')
          leer() { printf '%s' "$json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(String(j$1??''))}catch{process.stdout.write('invalid')}})"; }
          estado=$(leer '.status')
          crons=$(leer '.checks?.crons')
          echo "http=$status estado=$estado crons=$crons"
          if [ "$crons" = "config_ausente" ]; then
            echo "::warning::Hay un cron sin configurar (checks.crons=config_ausente). NO tumba el pulso a propósito: dejarlo rojo permanente esconde un cron muerto de verdad. Destrábalo en las variables de entorno."
          fi
          [ "$status" = "200" ] && [ "$estado" = "ok" ] || { echo "::error::/api/health no está healthy (http=$status estado=$estado crons=$crons); un cron vencido o con regresión se reporta como degraded."; exit 1; }

      # AUDITORÍA 22, OP-A1 (ALTO): `if: always()`. Este paso es la ÚNICA
      # defensa contra el modo de falla silencioso del deploy que documenta
      # CLAUDE.md —olvidar la bandera y quedarse con la versión anterior sin
      # aviso—, y nunca corría: el paso de arriba abortaba el job antes. Un
      # pulso rojo no puede llevarse por delante el cotejo del sha.
      - name: El sha desplegado es el que se pusheó (solo push con [deploy] en el asunto)
        if: always() && github.event_name == 'push'
        env:
          ASUNTO: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          asunto=$(printf '%s' "$ASUNTO" | head -n1)
          if ! printf '%s' "$asunto" | grep -qi '\[deploy\]'; then
            echo "El asunto no lleva [deploy]: este push NO construye a propósito (vercel.json ignoreCommand). Nada que cotejar."
            exit 0
          fi
          esperado=$(printf '%s' "$SHA" | cut -c1-7)
          for i in $(seq 1 20); do
            version=$(curl -sS --max-time 20 https://app.likida.ai/api/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "intento $i: esperado=$esperado desplegado=${version:-?}"
            [ "$version" = "$esperado" ] && exit 0
            sleep 30
          done
          echo "::error::Producción sigue en '${version:-?}' y el push con [deploy] fue $esperado — el build no llegó (mira el panel de Vercel o haz Redeploy)."
          exit 1
