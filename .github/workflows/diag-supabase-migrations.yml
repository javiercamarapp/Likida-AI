name: Diagnóstico — estado de migraciones Supabase

# Herramienta de UNA SOLA VEZ para diagnosticar el desajuste de nombres de
# migración entre el historial remoto (timestamps) y los archivos locales
# (NNNN_nombre.sql) — ver el hallazgo del 3-sep-2026. Solo LEE (`migration
# list`), nunca aplica ni repara nada. Se puede borrar este archivo una vez
# resuelto el desajuste.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Qué ambiente diagnosticar
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  diagnostico:
    name: Diagnóstico de migraciones — ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.target }}
    env:
      SUPABASE_CLI_VERSION: 2.115.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: supabase migration list (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.target == 'staging' && secrets.SUPABASE_PROJECT_REF_STAGING || secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration list
