name: Vercel rollback production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: URL o ID exacto del deployment estable al que volver
        required: true
        type: string
      confirmation:
        description: Escribe ROLLBACK_PRODUCTION para habilitar la acción
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback aprobado y explícito
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validar guardas fail-closed
        env:
          URL: ${{ inputs.deployment_url }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$URL" in https://*) ;; *) echo "::error::deployment_url debe ser HTTPS y explícito."; exit 1 ;; esac
          [ "$CONFIRM" = "ROLLBACK_PRODUCTION" ] || { echo "::error::Confirmación incorrecta; no se toca producción."; exit 1; }
      - name: Rollback al deployment especificado
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Falta VERCEL_TOKEN."; exit 1; }
          npx --yes vercel@41.7.3 rollback "$URL" --token "$VERCEL_TOKEN"
      - name: Verificar salud del deployment restaurado
        env:
          URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          # A36-R07-02: sin `--fail`. Volver a un deployment anterior deja la base
          # ADELANTE del código (`migracion.adelante > 0`), y `/api/health` lo
          # reporta como `degraded` con HTTP 503: con `--fail` el rollback
          # exitoso salía en rojo justo en el caso para el que existe. curl
          # sigue reintentando 5xx; lo que decide es el cuerpo, abajo.
          respuesta=$(curl --silent --show-error --retry 5 --retry-all-errors --max-time 15 "$URL/api/health")
          # Aceptable: status=ok, o degraded SOLO por migraciones adelante (la base
          # nunca atrás del código) con db ok y crons sin degradar. Cualquier otra
          # cosa (db caída, base atrás, crons vencidos) sigue siendo fallo.
          printf '%s' "$respuesta" | jq -e '.checks.db == "ok" and (.status == "ok" or ((.migracion.atras // 1) == 0 and (.migracion.adelante // 0) > 0 and (.checks.crons | IN("ok", "config_ausente"))))' >/dev/null
          echo '### Rollback verificado' >> "$GITHUB_STEP_SUMMARY"
          echo "- \`/api/health\`: status=$(printf '%s' "$respuesta" | jq -r '.status'), db=ok, migraciones adelante=$(printf '%s' "$respuesta" | jq -r '.migracion.adelante // 0') (esperado tras un rollback con migraciones posteriores)." >> "$GITHUB_STEP_SUMMARY"
