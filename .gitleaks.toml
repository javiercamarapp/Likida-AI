# CT-SEG-24: configuracion de gitleaks (workflow secretos.yml).
# Extiende las reglas por omision. Solo se permite lo que es un fixture
# sintetico confirmado a mano: valores literales concretos, o la regla de
# "llave generica" / "llave privada" SOLO dentro de archivos de prueba (no en
# codigo de produccion, scripts ni docs). Triage del 4-nov-2026 sobre TODO el historial (9,777
# commits): los hallazgos de reglas genericas eran fixtures o datos publicos
# (gitleaks 8.30.1 sin hallazgos con esta configuracion).
title = "Likida gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures sinteticos confirmados a mano (mismos valores que .gitguardian.yaml)"
regexes = [
  '''abcdefghjkmnpqrstvwxyz23''',
  '''VALOR-SINTETICO-98765''',
]

[[allowlists]]
description = "Tokens de prueba inventados dentro de pruebas unitarias/e2e y de SQL de supabase/tests"
condition = "AND"
targetRules = ["generic-api-key", "private-key"]
paths = [
  '''^src/.*\.test\.tsx?$''',
  '''^supabase/tests/.*\.sql$''',
  '''^supabase/verificaciones\.sql$''',
]

[[allowlists]]
description = "Capturas de portales publicos de terceros (sitekey de reCAPTCHA y similares, publicos por diseno) y catalogo publico de permisos CRE"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/(conocimiento/)?investigacion/portales/''',
  '''^src/lib/(cuadra|likida)/facturacion/permisos_cre\.json$''',
]
