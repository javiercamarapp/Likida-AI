# CT-SEG-24: configuracion de gitleaks (workflow secretos.yml).
# Extiende las reglas por omision. Solo se permite lo que es un fixture
# sintetico confirmado a mano: valores literales concretos, o la regla de
# "llave generica" SOLO en los archivos de prueba triados uno por uno (no en
# codigo de produccion, scripts, docs ni pruebas nuevas; la llave privada nunca se perdona). Triage del 4-nov-2026 sobre TODO el historial (9,777
# commits): los hallazgos de reglas genericas eran fixtures o datos publicos
# (gitleaks 8.30.1 sin hallazgos con esta configuracion).
title = "Likida gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures sinteticos confirmados a mano (mismos valores que .gitguardian.yaml)"
regexes = [
  '''abcdefghjkmnpqrstvwxyz23''',
  '''VALOR-SINTETICO-98765''',
]

[[allowlists]]
description = "Tokens de prueba inventados: SOLO los 12 archivos triados a mano (4-nov-2026), regla generic-api-key. Un archivo de prueba nuevo NO queda perdonado; private-key nunca se perdona en pruebas."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^src/lib/admin/calcom\.test\.ts$''',
  '''^src/lib/likida/agentes/investigador\.test\.ts$''',
  '''^src/lib/likida/carta_porte_docs/correo_entrante\.test\.ts$''',
  '''^src/lib/likida/conectores/cofre\.test\.ts$''',
  '''^src/lib/likida/conectores/credenciales\.test\.ts$''',
  '''^src/lib/likida/e2e/agente-03-carta-porte\.e2e\.test\.ts$''',
  '''^src/lib/likida/peajes/ciclo_completo\.e2e\.test\.ts$''',
  '''^src/lib/llm/fallo_modelo\.test\.ts$''',
  '''^supabase/tests/0563_peajes_correo_pull_anulacion\.sql$''',
  '''^supabase/tests/0325_capacidad_wa_jornada\.sql$''',
  '''^supabase/tests/0790_cp_envio_tms\.sql$''',
  '''^supabase/verificaciones\.sql$''',
]

[[allowlists]]
description = "Capturas de portales publicos de terceros (sitekey de reCAPTCHA y similares, publicos por diseno) y catalogo publico de permisos CRE"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/(conocimiento/)?investigacion/portales/''',
  '''^src/lib/(cuadra|likida)/facturacion/permisos_cre\.json$''',
]

[[allowlists]]
description = "Diccionarios de interfaz es/en (solo textos visibles: 'Generar secreto', 'Credencial desactivada.', 'Tokens usados'). Las claves contienen secreto/credencial/token y la regla generica los toma por llaves. Triado a mano el 11-nov-2026 (7 hallazgos: 71bf7734f en resto.ts, c00f4b9d8 en admin_dinero.ts), autorizado por el dueno. Solo generic-api-key y solo los diccionarios planos src/lib/i18n/{es,en}/<namespace>.ts (no pruebas, no codigo)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^src/lib/i18n/(es|en)/[a-z_]+\.ts$''',
]
